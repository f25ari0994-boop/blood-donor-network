<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="app-language" content="{{ language_preference|default('English') }}" data-authenticated="{{ 'true' if current_user_id else 'false' }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800020">
  <title>Donation History | Blood Donor Network</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/blood-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-consistency.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/simple-pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop-consistency.css') }}">
</head>
<body>
  <main class="simple-page">
    <a class="simple-link" href="{{ url_for('profile') }}">← My Profile</a>
    <h1>Donation and receipt history</h1> {% if donations %}<div class="simple-table-wrap">
        <table class="simple-table">
          <thead><tr><th>Date</th><th>Donor</th><th>Blood group</th><th>Location</th><th>Hospital</th><th>Units</th><th>Status</th></tr></thead>
          <tbody> {% for d in donations %}
              <tr><td>{{ d[1] }}</td><td>{{ d[9] }}</td><td>{{ d[10] }}</td><td>{{ d[3] or '—' }}</td><td>{{ d[2] or '—' }}</td><td>{{ d[4] }}</td><td>{{ d[5] }}</td></tr> {% endfor %}</tbody>
        </table>
      </div> {% else %}<p>No donation records are available yet.</p> {% endif %}
  </main>
<script src="{{ url_for('static', filename='js/language.js') }}" defer></script>
</body>
</html>
