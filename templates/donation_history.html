<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation History | Blood Donor Network"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/blood-logo.png') }}">
</head>
<body><main style="max-width:1100px;margin:40px auto;padding:24px;font-family:Arial,sans-serif;line-height:1.6"><a href="{{ url_for('profile') }}">← My Profile</a><h1>Donation and receipt history</h1>{% if donations %}<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Date</th><th>Donor</th><th>Blood group</th><th>Location</th><th>Hospital</th><th>Units</th><th>Status</th></tr></thead><tbody>{% for d in donations %}<tr><td>{{ d[1] }}</td><td>{{ d[9] }}</td><td>{{ d[10] }}</td><td>{{ d[3] or '—' }}</td><td>{{ d[2] or '—' }}</td><td>{{ d[4] }}</td><td>{{ d[5] }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p>No donation records are available yet.</p>{% endif %}</main></body></html>
