<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Details | Blood Donor Network"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/blood-logo.png') }}">
</head>
<body><main style="max-width:850px;margin:40px auto;padding:24px;font-family:Arial,sans-serif;line-height:1.6"><a href="{{ url_for('request_blood') }}">← My Matching</a><h1>Match #{{ match[0] }}</h1><p>Request: #{{ match[1] }}</p><p>Blood group: {{ match[10] }}</p><p>Location: {{ match[11] }}</p><p>Hospital: {{ match[12] }}</p><p>Units remaining: {{ match[14] }}</p><p>Match status: {{ match[5] }}</p><p>Donor: {{ match[15] }}</p><p>Requester: {{ match[20] or 'Requester' }}</p>
{% if contact_details %}<section style="padding:16px;border:1px solid #ddd;border-radius:10px"><h2>Contact details</h2><p>{{ contact_details.name }}</p>{% if contact_details.phone %}<a href="tel:{{ contact_details.phone }}">Call</a>{% endif %}{% if contact_details.whatsapp %} · <a href="https://wa.me/{{ contact_details.whatsapp }}" target="_blank" rel="noopener">WhatsApp</a>{% endif %}</section>{% else %}<p>Contact details become available after the requester confirms this match.</p>{% endif %}
{% if match[3] == current_user_id and match[5] == 'Confirmed' %}<form method="post" action="{{ url_for('report_match_donation', match_id=match[0]) }}" style="margin-top:24px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Donation date <input type="date" name="donation_date" required></label><label>Units donated <input type="number" name="units" min="1" max="{{ match[4] }}" value="1" required></label><button type="submit">Report donation</button></form>{% endif %}</main></body></html>
